# ===== APPLICATION CONFIGURATION =====
spring.application.name=blog-service
server.port=8081
# ===== DATABASE CONFIGURATION =====
spring.data.mongodb.uri=mongodb://localhost:27017/blog
# MongoDB connection settings optimized for CQRS
spring.data.mongodb.auto-index-creation=true
# ===== JSON CONFIGURATION =====
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
# ===== LOGGING CONFIGURATION =====
logging.level.app.quantun.blog=INFO
logging.level.app.quantun.blog.application.command=DEBUG
logging.level.app.quantun.blog.application.query=DEBUG
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.web=WARN
# Logging pattern with trace information
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
# ===== ACTUATOR CONFIGURATION =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,caches
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
# Custom actuator endpoints for CQRS
management.endpoint.health.show-components=always
# ===== METRICS CONFIGURATION =====
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:local}
# CQRS-specific metrics
management.metrics.tags.architecture=cqrs-hexagonal
# ===== CACHE CONFIGURATION =====
spring.cache.type=simple
spring.cache.cache-names=blog-posts,authors,tags,search-results
# ===== OPENAPI DOCUMENTATION =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false
# Enhanced OpenAPI info for CQRS
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.displayOperationId=true
# ===== CQRS CONFIGURATION =====
# Data migration settings
blog.migration.cqrs.enabled=false
blog.migration.cqrs.backup-before-migration=true
blog.migration.cqrs.verify-after-migration=true
# Performance settings for CQRS
blog.cqrs.query.default-page-size=10
blog.cqrs.query.max-page-size=100
blog.cqrs.command.timeout=30s
blog.cqrs.query.timeout=10s
# Query optimization
blog.cqrs.query.enable-projection=true
blog.cqrs.query.enable-denormalization=true
# ===== PAGINATION DEFAULTS =====
blog.pagination.default-page=0
blog.pagination.default-size=10
blog.pagination.max-size=100
# ===== ASYNC CONFIGURATION =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
# ===== ENVIRONMENT-SPECIFIC PROFILES =====
---
# Development Profile
spring.config.activate.on-profile=dev
logging.level.app.quantun.blog=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
# Enable migration in development
blog.migration.cqrs.enabled=true
# Development-specific database
spring.data.mongodb.uri=mongodb://localhost:27017/blog-dev
# Enable all actuator endpoints in development
management.endpoints.web.exposure.include=*
---
# Test Profile  
spring.config.activate.on-profile=test
# Test database
spring.data.mongodb.uri=mongodb://localhost:27017/blog-test
# Disable async processing in tests
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
# Fast fail for tests
blog.cqrs.command.timeout=5s
blog.cqrs.query.timeout=3s
# Disable migration in tests
blog.migration.cqrs.enabled=false
---
# Production Profile
spring.config.activate.on-profile=prod
# Production logging
logging.level.root=WARN
logging.level.app.quantun.blog=INFO
# Security-focused actuator exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Production database with connection pool
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/blog}
# Production optimizations
blog.cqrs.query.enable-projection=true
blog.cqrs.query.enable-denormalization=true
# Disable migration in production (should be done manually)
blog.migration.cqrs.enabled=false
---
# Cache-enabled Profile
spring.config.activate.on-profile=cache-enabled
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m
# Cache-specific configuration for CQRS read models
blog.cache.blog-posts.ttl=30m
blog.cache.search-results.ttl=5m
blog.cache.authors.ttl=1h
---
# Metrics-enabled Profile
spring.config.activate.on-profile=metrics-enabled
# Enhanced metrics collection
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
# Custom metrics for CQRS operations
management.metrics.tags.cqrs.command.enabled=true
management.metrics.tags.cqrs.query.enabled=true
