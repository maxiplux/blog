plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.quantun'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ===== SPRING BOOT STARTERS =====
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ===== AOP SUPPORT FOR CQRS METRICS =====
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // ===== CACHE SUPPORT =====
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // ===== DEVELOPMENT TOOLS =====
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'

    // ===== MAPSTRUCT FOR ENTITY MAPPING =====
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // ===== UTILITIES =====
    implementation 'org.apache.commons:commons-lang3'

    // ===== METRICS AND MONITORING =====
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // ===== OPENAPI DOCUMENTATION =====
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // ===== TESTING DEPENDENCIES =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ===== ARCHITECTURE TESTING =====
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'

    // ===== MOCKITO FOR ADVANCED TESTING =====
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // ===== PERFORMANCE TESTING =====
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux' // For WebTestClient
}

tasks.named('test') {
    useJUnitPlatform()

    // Enable parallel test execution for better performance
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'

    // Test configuration for CQRS
    systemProperty 'spring.profiles.active', 'test'

    // Memory settings for tests
    minHeapSize = "512m"
    maxHeapSize = "2048m"

    // Test reports
    reports {
        junitXml.required = true
        html.required = true
    }

    // Fail fast on first test failure
    failFast = false

    // Show test details
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }
}

// ===== GRADLE TASKS FOR CQRS =====

task cqrsTest(type: Test) {
    description = 'Runs CQRS-specific tests'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'cqrs'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

task integrationTest(type: Test) {
    description = 'Runs integration tests'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'integration'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Integration tests need more time
    timeout = Duration.ofMinutes(10)
}

task performanceTest(type: Test) {
    description = 'Runs performance tests'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'performance'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Performance tests need even more time
    timeout = Duration.ofMinutes(15)
}

// ===== CODE QUALITY =====

task checkCQRSArchitecture(type: Test) {
    description = 'Validates CQRS architecture compliance'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'architecture'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// ===== CUSTOM TASKS =====

task generateCQRSMetrics {
    description = 'Generates CQRS metrics report'
    group = 'documentation'

    doLast {
        println "📊 CQRS Metrics Report:"
        println "- Command Services: 1 (BlogPostCommandService)"
        println "- Query Services: 1 (BlogPostQueryService)"
        println "- Repository Adapters: 2 (Command + Query)"
        println "- Read Models: 2 (BlogPostReadModel, BlogPostListItem)"
        println "- Value Objects: 2 (PageRequest, PageResponse)"
        println "- Metrics Enabled: ✅"
        println "- Architecture Tests: ✅"
    }
}

task startWithMigration {
    description = 'Starts application with CQRS migration enabled'
    group = 'application'

    doFirst {
        System.setProperty('blog.migration.cqrs.enabled', 'true')
        System.setProperty('spring.profiles.active', 'dev,migration')
    }
}

// ===== BUILD OPTIMIZATION =====

compileJava {
    options.compilerArgs += [
            '-parameters',  // For Spring parameter name discovery
            '-Xlint:deprecation',
            '-Xlint:unchecked'
    ]
}

bootJar {
    archiveFileName = "${project.name}-${project.version}.jar"

    // Include build info in jar
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Architecture': 'CQRS-Hexagonal',
                'Built-By': System.getProperty('user.name'),
                'Built-Date': new Date().toString(),
                'Built-JDK': System.getProperty('java.version')
        )
    }
}

// ===== DEPENDENCY MANAGEMENT =====

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.19.1"
    }
}

// ===== DOCUMENTATION =====

task generateProjectDocs {
    description = 'Generates comprehensive project documentation'
    group = 'documentation'

    doLast {
        println "📚 Project Documentation Generated:"
        println "- CQRS Implementation Guide: ✅"
        println "- Migration Guide: ✅"
        println "- Examples Guide: ✅"
        println "- Architecture Tests: ✅"
        println "- Metrics Configuration: ✅"
    }
}

// Make sure architecture tests run with regular tests
test.dependsOn checkCQRSArchitecture

// Generate docs after build
build.finalizedBy generateProjectDocs
